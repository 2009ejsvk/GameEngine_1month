StatusValueOffsetY = 30

# 레이블/값 텍스트 칸 높이
StatusLabelHeight = 30
StatusValueHeight = 30

# 폰트 크기
StatusLabelFontSize = 12
StatusValueFontSize = 22

# ── 블록별 미세 위치 조정 ─────────────────────────────────
#  위의 자동배치 위치에서 추가로 X/Y 방향으로 이동합니다.
#  양수 = 오른쪽/아래,  음수 = 왼쪽/위
#  기본값 0 = 이동 없음

# [예산] 블록 보정
BudgetBlockOffsetX = 150

BudgetBlockOffsetY = 0

# [인구] 블록 보정
NpcBlockOffsetX = 70
NpcBlockOffsetY = 0

# [지지율] 블록 보정
SupportBlockOffsetX = 15
SupportBlockOffsetY = 0


