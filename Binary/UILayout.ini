# ============================================================
#  10. 범용 위젯 오버라이드
#      이름만 알면 어떤 UI든 직접 찍어서 보정 가능
# ============================================================
#
#  위젯 경로 목록:
#    - 게임 실행 중 자동 생성 파일 확인
#    - Binary/UIWidgetPaths.txt
#
#  문법 1) 전체 경로로 정확히 지정
#    Widget.<루트/자식/대상>.속성 = 값
#
#    예)
#    Widget.TopHudWidget/TopHud_DateText.OffsetY = -4
#    Widget.EdictWidget/Edict_DetailCostText.FontSizeAdd = 2
#
#  문법 2) 이름만으로 전체 매칭
#    WidgetName.<위젯이름>.속성 = 값
#
#    예)
#    WidgetName.TopHud_DateText.OffsetY = -4
#
#  지원 속성
#    위치: PosX PosY OffsetX OffsetY
#    크기: Width Height WidthAdd HeightAdd
#    기준점: PivotX PivotY
#    표시: Enable Opacity ZOrder
#    색상: TintR TintG TintB TintA
#    텍스트: FontSize FontSizeAdd ShadowOffsetX ShadowOffsetY
#
#  규칙
#    - WidgetName 보다 Widget(전체 경로) 쪽이 우선 적용됩니다.
#    - Width/Height 는 절대값, WidthAdd/HeightAdd 는 현재 크기 보정입니다.
#    - FontSizeAdd 는 현재 폰트 크기에 더하는 방식입니다.
#    - Enable 은 0/1 또는 false/true 사용 가능.
#
#  아래 예시는 기본 비활성 상태입니다. 필요할 때 주석을 해제하세요.
#
# Widget.TopHudWidget/TopHud_DateText.OffsetY = -4
# Widget.TopHudWidget/TopHud_DateText.FontSizeAdd = 2
# Widget.EdictWidget/EdictMenu_DetailCostText.OffsetX = 12
# Widget.CitizenInfoWidget/CitizenInfo_TitleText.FontSize = 28
# WidgetName.TopHud_MenuButton_1.WidthAdd = 10


