# ============================================================
#  UI 레이아웃 설정 파일  (UILayout.ini)
#
#  게임을 켜둔 채로 숫자만 바꾸고 저장하면 약 0.5초 뒤
#  화면에 바로 반영됩니다. 빌드·재시작 불필요!
#
#  규칙:
#    - '#' 또는 ';' 로 시작하는 줄은 주석 (무시됨)
#    - 단위는 픽셀(px), 기준 해상도 1920x1080
#    - 소수점 사용 가능 (예: 13.5)
# ============================================================


# ============================================================
#  1. 상단 상태바
#     화면 왼쪽 위 [ 예산 | 인구 | 지지율 ] 바
# ============================================================

# 상태바 전체 위치 (화면 기준)
StatusBarX = 14
StatusBarY = 10

# 상태바 전체 높이
StatusBarHeight = 94

# 바 안쪽 좌우 여백
StatusBarPaddingX = 20

# 각 블록 너비  →  글자가 잘리면 늘리세요
StatusBudgetBlockWidth  = 218
StatusNpcBlockWidth     = 128
StatusSupportBlockWidth = 132

# 블록과 블록 사이 간격
StatusBlockGap = 18

# 블록 안 아이콘 크기 (정사각형)
StatusIconSize    = 26
StatusIconTextGap = 10

# 레이블/값 텍스트의 Y 위치 (상태바 상단에서 아래로)
