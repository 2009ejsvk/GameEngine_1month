# ============================================================
# 10. 위젯 오버라이드 가이드
# 실제 활성 오버라이드는 이 폴더의 *.ini 파일에 적습니다.
# ============================================================
#
# 문법 1) 전체 경로 기준
#   Widget.<루트/자식/...>.속성 = 값
#
# 문법 2) 위젯 이름 기준
#   WidgetName.<위젯이름>.속성 = 값
#
# 우선순위
#   - Widget 경로 규칙이 WidgetName 규칙보다 우선합니다.
#
# 지원 속성
#   PosX PosY OffsetX OffsetY Width Height WidthAdd HeightAdd
#   PivotX PivotY Opacity ZOrder TintR TintG TintB TintA
#   FontSize FontSizeAdd ShadowOffsetX ShadowOffsetY Enable
#
# 예시
# Widget.TopHudWidget/TopHud_DateText.OffsetY = -4
# Widget.CitizenInfoWidget/CitizenInfo_TitleText.FontSize = 28
# WidgetName.TopHud_MenuButton_1.WidthAdd = 10
