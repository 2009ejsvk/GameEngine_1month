# ============================================================
# 10. 위젯 오버라이드 가이드
# 실제 활성 오버라이드는 이 폴더의 *.ini 파일에 적습니다.
# ============================================================
#
# 문법 1) 전체 경로 기준
#   Widget.<루트/자식/...>.속성 = 값
#
# 문법 2) 전체 경로 prefix 기준
#   WidgetPathPrefix.<루트/자식 prefix>.속성 = 값
#
# 문법 3) 위젯 이름 기준
#   WidgetName.<위젯이름>.속성 = 값
#
# 문법 4) 위젯 이름 prefix 기준
#   WidgetNamePrefix.<위젯이름 prefix>.속성 = 값
#
# 우선순위
#   - WidgetNamePrefix
#   - WidgetName
#   - WidgetPathPrefix
#   - Widget
#   - 아래로 갈수록 더 우선합니다.
#
# 지원 속성
#   PosX PosY OffsetX OffsetY Angle AngleAdd Width Height WidthAdd HeightAdd
#   PivotX PivotY Opacity ZOrder TintR TintG TintB TintA
#   FontSize FontSizeAdd ShadowOffsetX ShadowOffsetY Enable
#
# 예시
# Widget.TopHudWidget/TopHud_DateText.OffsetY = -4
# WidgetPathPrefix.TopHudWidget/TopHud_MenuButton_.OffsetY = -4
# Widget.CitizenInfoWidget/CitizenInfo_TitleText.FontSize = 28
# WidgetName.TopHud_MenuButton_1.WidthAdd = 10
# WidgetNamePrefix.TaskWidget_RowTitle_.FontSizeAdd = 2
