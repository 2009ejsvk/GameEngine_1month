# ── 시민 액션 버튼 일괄 오버라이드 ──────────────────────────────
# 버튼 시각 구성:
#   CitizenInfo_CitizenActionButton_N  — 버튼 배경 텍스처 + 텍스트 라벨(자식 위젯)
#   CitizenInfo_CitizenActionIcon_N    — 아이콘 이미지 (별도 독립 위젯)
#   CitizenInfo_CitizenActionButton_LabelBg_N — 라벨 배경 이미지 (별도 독립 위젯)
#
# ※ 버튼 하나를 '통째로' 움직이려면 위 세 종류를 같은 양만큼 모두 이동해야 함.
#    텍스트 라벨(CitizenInfo_CitizenActionButton_Label_N)은 버튼의 자식이라
#    버튼이 움직이면 자동으로 따라오므로 별도 오프셋 금지 (이중 이동 발생).
#
# ※ 우선순위: CitizenInfo_CitizenActionButton_Label_ (더 긴 prefix) 가
#              CitizenInfo_CitizenActionButton_ (짧은 prefix) 를 덮어써서
#              라벨만 OffsetY=0 으로 유지됨.
#
# ── 시민 액션 버튼 개별 미세조정용 Prefix ───────────────────────
# 기본적으로 버튼/텍스트/아이콘 공통 이동·크기 조절은
# 19_CitizenInfoContent.ini 의 아래 키를 사용:
#   CitizenLayoutActionGroupOffsetX
#   CitizenLayoutActionGroupOffsetY
#   CitizenLayoutActionGroupWidthAdd
#   CitizenLayoutActionGroupHeightAdd
# 아래 Prefix 항목은 각 요소를 따로 미세조정할 때만 사용.
