# ============================================================
# 18. 항구(Harbor) 화물 스크롤 영역 오버라이드 (행 8~30)
# OverviewMetricLabel/Value 8~30 은 항구 패널의 선적 화물 목록에
# 사용됩니다. 폰트·크기·위치를 항구 전용으로 조정할 때 여기서 수정하세요.
#
# [일괄 수정 — 행 8~30 전체]
#   WidgetNamePrefix 는 가장 낮은 우선순위로 적용됩니다.
#   행 1~7 은 11_WidgetOverrides_CitizenInfo.ini 의 PathExact 항목이
#   더 높은 우선순위로 덮어쓰므로 영향을 받지 않습니다.
#   특정 행만 다르게 하려면 아래 [개별 예외] 섹션에 PathExact 항목을 추가하세요.
# ============================================================

WidgetNamePrefix.CitizenInfo_HarborCargoLabel_.OffsetX = 0
WidgetNamePrefix.CitizenInfo_HarborCargoLabel_.OffsetY = 0
WidgetNamePrefix.CitizenInfo_HarborCargoLabel_.WidthAdd = 0
WidgetNamePrefix.CitizenInfo_HarborCargoLabel_.HeightAdd = 0
WidgetNamePrefix.CitizenInfo_HarborCargoLabel_.FontSizeAdd = 0
WidgetNamePrefix.CitizenInfo_HarborCargoValue_.OffsetX = 0
WidgetNamePrefix.CitizenInfo_HarborCargoValue_.OffsetY = 0
WidgetNamePrefix.CitizenInfo_HarborCargoValue_.WidthAdd = 0
WidgetNamePrefix.CitizenInfo_HarborCargoValue_.HeightAdd = 0
WidgetNamePrefix.CitizenInfo_HarborCargoValue_.FontSizeAdd = 0

# [개별 예외] 특정 행만 다르게 적용할 경우 아래에 추가
# (PathExact 는 WidgetNamePrefix 보다 우선순위가 높습니다)
# 예시:
# Widget.CitizenInfoWidget/CitizenInfo_HarborCargoLabel_8.FontSizeAdd = -2
# Widget.CitizenInfoWidget/CitizenInfo_HarborCargoValue_8.WidthAdd = 20
